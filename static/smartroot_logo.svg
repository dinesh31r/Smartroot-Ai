<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rootGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#a0643b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6b3e26;stop-opacity:1" />
    </linearGradient>
    <filter id="shieldShadow">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Shield border -->
  <path d="M 100 15 L 170 50 L 170 120 Q 170 190 100 260 Q 30 190 30 120 L 30 50 Z" 
        fill="url(#shieldGradient)" stroke="#059669" stroke-width="2.5" filter="url(#shieldShadow)"/>

  <!-- Inner shield highlight -->
  <path d="M 100 25 L 160 55 L 160 120 Q 160 185 100 250 Q 40 185 40 120 L 40 55 Z" 
        fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Water droplet - cyan blue -->
  <path d="M 100 50 Q 96 56 96 62 Q 96 70 100 74 Q 104 70 104 62 Q 104 56 100 50 Z" 
        fill="#06b6d4" opacity="0.9"/>

  <!-- Grass leaves at top -->
  <g id="grass">
    <!-- Far left leaf -->
    <path d="M 70 80 Q 68 65 70 55 Q 72 68 75 80 Z" fill="#34d399" opacity="0.85"/>
    <!-- Left leaf -->
    <path d="M 82 75 Q 78 58 82 45 Q 88 62 92 75 Z" fill="#34d399" opacity="0.9"/>
    <!-- Center-left leaf -->
    <path d="M 93 70 Q 90 50 95 38 Q 103 55 108 70 Z" fill="#34d399" opacity="0.95"/>
    <!-- Center-right leaf -->
    <path d="M 108 70 Q 110 50 115 38 Q 115 55 115 70 Z" fill="#34d399" opacity="0.95"/>
    <!-- Right leaf -->
    <path d="M 118 75 Q 125 58 125 45 Q 117 62 112 75 Z" fill="#34d399" opacity="0.9"/>
    <!-- Far right leaf -->
    <path d="M 130 80 Q 133 65 130 55 Q 128 68 125 80 Z" fill="#34d399" opacity="0.85"/>
  </g>

  <!-- Root system -->
  <g id="roots" stroke="url(#rootGradient)" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main taproot -->
    <path d="M 100 110 Q 100 135 100 165"/>
    
    <!-- Left primary root -->
    <path d="M 100 130 Q 80 150 60 170"/>
    <!-- Left secondary roots -->
    <path d="M 80 150 Q 70 160 60 175"/>
    <path d="M 75 155 Q 65 165 55 180"/>
    
    <!-- Right primary root -->
    <path d="M 100 130 Q 120 150 140 170"/>
    <!-- Right secondary roots -->
    <path d="M 120 150 Q 130 160 140 175"/>
    <path d="M 125 155 Q 135 165 145 180"/>
  </g>

  <!-- Text: SmartRoot AI -->
  <text x="100" y="210" font-family="'Arial', 'Helvetica', sans-serif" font-size="16" font-weight="bold" 
        text-anchor="middle" fill="#047857">SmartRoot AI</text>

  <!-- Text: PROJECT -->
  <text x="100" y="232" font-family="'Arial', 'Helvetica', sans-serif" font-size="10" font-weight="bold" 
        text-anchor="middle" fill="#059669" letter-spacing="2">PROJECT</text>
</svg>
